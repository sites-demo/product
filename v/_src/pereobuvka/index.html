}

function linesWithKey(o,text,key,maxW){ // wrap and keep key highlighting
  const lines=wrap(o,text,maxW);let off=0;const ki=text.indexOf(key);
  return lines.map(l=>{const st=text.indexOf(l,off);off=st+l.length;const parts=[];
    if(ki>=0&&ki<st+l.length&&ki+key.length>st){const a=Math.max(ki,st)-st,b=Math.min(ki+key.length,st+l.length)-st;
      if(a>0)parts.push([l.slice(0,a),false]);parts.push([l.slice(a,b),true]);if(b<l.length)parts.push([l.slice(b),false]);}
    else parts.push([l,false]);return parts;});
}

  else if(tf<b(8)){const k=prog(tf,b(7),BEAT);const end=v3(-.55,.2,.75);
    shopPhone.position.set(lerp(PHONE_HOME.x,end.x,k),lerp(PHONE_HOME.y,end.y,k)+Math.sin(k*Math.PI)*.5,lerp(PHONE_HOME.z,end.z,k));

      towerB.forEach((m,i)=>{const t0=b(3)+i*BEAT*.5;if(tf<t0)return;const k=out3(prog(tf,t0,.3));
        const from=v3(-1.2,1.1,-.6),to=v3(.95+(i%2)*.1,.45+i*.25,.35);billboard(m,lerpV(from,to,k).add(v3(0,Math.sin(k*Math.PI)*.4,0)),1,(hash(i)-.5)*.25);});
      fountainB.forEach((m,i)=>{const t0=b(8)+i*.07;if(tf<t0)return;const r=tf-t0;const vx=(hash(i+9)-.5)*2.2,vz=(hash(i+4)-.3)*1.6,vy=3.2+hash(i+2)*1.2;
        const p=v3(-.55+vx*r,.25+vy*r-4.9*r*r*.35,.75+vz*r);if(p.y<-.5)return;billboard(m,p,1,(hash(i)-.5)*.6);});
    }
    if(t>=T_CALM){const k=out3(prog(t,b(32.5),.6));const p=lerpV(v3(-.85,2.6,-.5),v3(-.85,1.6,-.45),k);if(t<b(35))billboard(leadB,p,1,0);}
    drawShopScreen(t);
    renderer.render(scene,cam);o.drawImage(renderer.domElement,0,0);
    if(t>=T_FREEZE&&t<T_SITE){o.save();o.globalAlpha=.25;o.fillStyle='#0d1510';o.fillRect(0,0,W,H);o.restore();}
  }
  if(t>=T_SITE&&t<T_CALM){
    o.fillStyle=C.bg;o.fillRect(0,0,W,H);
    const g=o.createRadialGradient(540,1100,100,540,1100,1100);g.addColorStop(0,'#1c2c22');g.addColorStop(1,C.bg);o.fillStyle=g;o.fillRect(0,0,W,H);
    const zk=out3(prog(t,T_SITE,.4));
    phone2D(o,t,drawShopSite,{x:lerp(240,110,zk),y:lerp(700,500,zk),w:lerp(600,860,zk)});
  }
  if(t>=T_END)finalCard(o,t);
  // captions
  plate(o,['ПЕРЕОБУВКА.','ВАШ ТЕЛЕФОН:'],t,-1,T_FREEZE,{red:true,size:92,keyLine:1});
  plate(o,['А МОЖНО ТАК:'],t,T_FREEZE,T_SITE,{size:110,y:300});
  plate(o,['ЦЕНА ПО РАДИУСУ'],t,T_SITE,b(19),{});
  plate(o,['СВОБОДНОЕ ВРЕМЯ'],t,b(19),b(24),{});
  plate(o,['ЗАПИСЬ','В ОДНО КАСАНИЕ'],t,b(24),T_CALM,{keyLine:1});
  plate(o,['ЗАЯВКИ ПРИХОДЯТ','С САЙТА'],t,T_CALM,T_END,{keyLine:1});
  // punch on beats + shake on hits
  return out.toDataURL('image/jpeg',.94);
}
window.renderAt=renderAt;window.TOTAL=TOTAL;
for(const w of [900,800,600])await document.fonts.load(font(100,w),'АБВЁЙабв ABC%');
