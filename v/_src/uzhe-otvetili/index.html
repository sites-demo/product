// ---------- 2D helpers ----------
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function wrap(c,text,maxW){const words=text.split(' ');const lines=[];let cur='';for(const w of words){const tt=cur?cur+' '+w:w;if(c.measureText(tt).width>maxW&&cur){lines.push(cur);cur=w}else cur=tt}if(cur)lines.push(cur);return lines;}
function font(px,wt=600){return `${wt} ${px}px ${F}`;}
function drop(c,x,y,s,col){c.fillStyle=col;c.beginPath();c.moveTo(x,y-s);c.bezierCurveTo(x-s*.7,y-s*.1,x-s*.75,y+s*.25,x-s*.75,y+s*.42);c.arc(x,y+s*.42,s*.75,Math.PI,0,true);c.bezierCurveTo(x+s*.75,y+s*.25,x+s*.7,y-s*.1,x,y-s);c.fill();}
function check(c,x,y,s,col,lw){c.strokeStyle=col;c.lineWidth=lw;c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(x-s*.5,y);c.lineTo(x-s*.12,y+s*.38);c.lineTo(x+s*.55,y-s*.38);c.stroke();}
function ripple(c,x,y,k){if(k<=0||k>=1)return;c.save();c.globalAlpha=(1-k)*.55;c.fillStyle='#1d2a24';c.beginPath();c.arc(x,y,30+k*60,0,7);c.fill();c.globalAlpha=(1-k)*.9;c.fillStyle='#ffffff';c.beginPath();c.arc(x,y,26*(1-k*.4),0,7);c.fill();c.restore();}

const SW=720,SH=1492;
function chatFrame(c,name,sub,avatar,avCol){

  c.fillStyle='#d6ddd6';c.fillRect(0,190,SW,2);
}
function bubble(c,y,text,{outgoing=false,size=50,k=1,maxW=540,time=''}={}){
  c.font=font(size,500);const lines=wrap(c,text,maxW);const lh=size*1.28;
  const w=Math.max(...lines.map(l=>c.measureText(l).width))+56+(time?70:0),h=lines.length*lh+40;
  const x=outgoing?SW-36-w:36;
  c.save();const s=back(k);c.translate(outgoing?x+w:x,y+h);c.scale(s,s);c.translate(-(outgoing?x+w:x),-(y+h));c.globalAlpha=clamp(k*3);
  c.fillStyle=outgoing?'#d4f2bd':'#ffffff';rr(c,x,y,w,h,30);c.fill();
  c.fillStyle='#18201b';lines.forEach((l,i)=>c.fillText(l,x+28,y+20+size*.95+i*lh));
  if(time){c.fillStyle='#8a948e';c.font=font(24,500);c.fillText(time,x+w-80,y+h-18);}
  c.restore();return h;
}
function linkCard(c,y,{outgoing=true,k=1,tap=0}={}){

}
function inputBar(c,text,{k=1,sendTap=0,caret=false}={}){

  lines.forEach((l,i)=>c.fillText(l,56,y+54+i*lh));
  if(caret&&lines.length){const lw=c.measureText(lines[lines.length-1]).width;c.fillStyle='#3f9f8f';c.fillRect(58+lw,y+16+(lines.length-1)*lh,4,44);}
  c.fillStyle=text?'#3f9f8f':'#c9d1cb';c.beginPath();c.arc(SW-66,y+h-55,42,0,7);c.fill();
  c.fillStyle='#fff';c.beginPath();c.moveTo(SW-84,y+h-76);c.lineTo(SW-44,y+h-55);c.lineTo(SW-84,y+h-34);c.lineTo(SW-76,y+h-55);c.fill();
  if(sendTap)ripple(c,SW-66,y+h-55,sendTap);

function richLine(o,parts,cx,y,size,col,keyCol){ // parts: [[text,isKey],...]
  o.font=font(size,800);const total=parts.reduce((s,[t])=>s+o.measureText(t).width,0);let x=cx-total/2;

function splitKey(text,key){const i=text.indexOf(key);if(!key||i<0)return [[text,false]];return [[text.slice(0,i),false],[key,true],[text.slice(i+key.length),false]].filter(p=>p[0]);}
function linesWithKey(o,text,key,maxW){ // wrap and keep key highlighting
  const lines=wrap(o,text,maxW);let off=0;const ki=text.indexOf(key);
  return lines.map(l=>{const st=text.indexOf(l,off);off=st+l.length;const parts=[];
    if(ki>=0&&ki<st+l.length&&ki+key.length>st){const a=Math.max(ki,st)-st,b=Math.min(ki+key.length,st+l.length)-st;
      if(a>0)parts.push([l.slice(0,a),false]);parts.push([l.slice(a,b),true]);if(b<l.length)parts.push([l.slice(b),false]);}
    else parts.push([l,false]);return parts;});

function screenShot(ph,dist,side=0,up=0){
  ph.updateWorldMatrix(true,false);

  const n=v3(0,0,1).applyQuaternion(ph.getWorldQuaternion(new THREE.Quaternion())).normalize();
  const u=v3(0,1,0).applyQuaternion(ph.getWorldQuaternion(new THREE.Quaternion())).normalize();

  const use3D = t<TIN+.5 || (t>=S.less.start-.3 && t<S.cta.start-.2);
  if(use3D){
    let showHead=true;
    if(t<1.55){ // S1a: front medium shot, push in
      const k=io(t/1.55);setCam(lerpV(v3(.3,1.75,3.7),v3(.12,1.6,2.75),k),v3(0,1.38,0),v3(0,1,0));
    }else if(t<S.fam.start-.05){ // S1b: quick move to owner's screen
      owner.g.updateWorldMatrix(true,true);
      const s=screenShot(ownerPhone,1.35,.12,.1);const k=out3(prog(t,1.55,1.2));
      const s2=screenShot(ownerPhone,.84,.03,.09);setCam(lerpV(s.pos,s2.pos,k),s.target,s.up);showHead=false;
    }else if(t<T2b){ // S2a: typing long reply, slow push
      const s=screenShot(ownerPhone,.84,.03,-.03);const s2=screenShot(ownerPhone,.8,-.02,-.05);
      setCam(lerpV(s.pos,s2.pos,io(prog(t,S.fam.start,T2b-S.fam.start))),s.target,s.up);showHead=false;
    }else if(t<S.link.start-.05){ // S2b: client waiting
      const k=io(prog(t,T2b,2));setCam(lerpV(v3(40.35,1.35,3.3),v3(40.25,1.3,2.9),k),v3(40,1.0,-.5),v3(0,1,0));
      client.head.rotation.set(.3+Math.sin(t*3)*.03,Math.sin(t*1.7)*.12,0);
      client.kneeR.rotation.x=Math.PI/2+Math.max(0,Math.sin(t*9))*.12;
    }else if(t<T3b){ // S3a: owner deletes draft and sends link
      const s=screenShot(ownerPhone,.82,0,-.04);setCam(s.pos,s.target,s.up);showHead=false;
    }else{ // S3b: client receives link, taps, camera dives into screen
      client.g.updateWorldMatrix(true,true);
      const s=screenShot(clientPhone,.84,.03,.09),s2=screenShot(clientPhone,.42,0,.02);
      const k=io(prog(t,TAP_CARD+.1,TIN+.5-(TAP_CARD+.1)));
      setCam(lerpV(s.pos,s2.pos,k),s.target,s.up);
    }
    if(t>=S.less.start-.3){ // S7: owner relaxed with reply, three cards
      if(t<T7b){showHead=false;const s=screenShot(ownerPhone,.86,.03,.09),s2=screenShot(ownerPhone,.8,0,.09);setCam(lerpV(s.pos,s2.pos,io(prog(t,S.less.start-.3,2.3))),s.target,s.up);}
      else{showHead=true;const k=io(prog(t,T7b,4.5));setCam(lerpV(v3(.62,1.62,3.4),v3(.55,1.6,3.05),k),v3(.45,1.33,0),v3(0,1,0));}
      owner.head.rotation.set(.25,.05,0);
    }
    owner.head.visible=showHead;client.head.visible=!(t>=T3b&&t<S.less.start-.3);
    drawOwnerScreen(t);drawClientScreen(t);
    renderer.render(scene,cam);
    o.drawImage(renderer.domElement,0,0);
  }
  // 2D phone scenes (site, messenger)
  if(t>=TIN+.2 && t<S.less.start-.3+.35){
    const a=t<TIN+.5?prog(t,TIN+.2,.3):(t>S.less.start-.3?1-prog(t,S.less.start-.3,.35):1);
    o.save();o.globalAlpha=a;o.fillStyle=C.bg;o.fillRect(0,0,W,H);
    const g=o.createRadialGradient(540,1100,100,540,1100,1100);g.addColorStop(0,'#1c2c22');g.addColorStop(1,C.bg);o.fillStyle=g;o.fillRect(0,0,W,H);
    o.restore();
    const sw=prog(t,T_BTN+.4,.45); // slide from site to messenger
    const fn=(c,tt)=>{if(sw<1){c.save();c.translate(-SW*io(sw),0);drawSite(c,tt);c.restore();}
      if(sw>0){c.save();c.translate(SW*(1-io(sw)),0);drawClientChat2(c,tt);c.restore();}};
    const zk=out3(prog(t,TIN+.2,.5));
    const pan=io(prog(t,T_BTN+.4,.6));
    phone2D(o,t,fn,{x:lerp(170,110,zk),y:lerp(520,470,zk)-pan*930,w:lerp(740,860,zk),a});
  }
  if(t>=S.cta.start-.2){finalScreen(o,t);}
  else{
    // S1 big incoming questions
    if(t<S.fam.start+.1){
      Q.forEach((q,i)=>{const ts=wt('q',[0,2,4][i])-.06;const k=prog(t,ts,.35);if(k<=0)return;
        const ko=prog(t,S.fam.start-.15,.25);
        o.save();o.globalAlpha=clamp(k*3)*(1-ko);o.font=font(78,800);
        const w=o.measureText(q).width+90,h=128,x=[110,250,150][i],y=250+i*158;
        const s=back(k);o.translate(x,y+h);o.scale(s,s);o.rotate(([-.03,.025,-.015][i])*(1));o.translate(-x,-(y+h));
        o.shadowColor='rgba(0,0,0,.28)';o.shadowBlur=36;o.shadowOffsetY=12;
        o.fillStyle='#ffffff';rr(o,x,y,w,h,52);o.fill();o.beginPath();o.moveTo(x+20,y+h-40);o.lineTo(x-8,y+h+6);o.lineTo(x+64,y+h-12);o.fill();
        o.shadowColor='transparent';o.fillStyle=C.ink;o.fillText(q,x+45,y+90);o.restore();});
    }
    HB=226;
    for(const [tx,key,a,b] of HEAD){headline(o,tx,key,prog(t,a,.35),prog(t,b,.2));}
    if(t>=T2b&&t<S.link.start-.05){const k=prog(t,T2b+.15,.35);o.save();o.globalAlpha=clamp(k*2);
      const x=590,y=640,s=back(k);o.translate(x,y+120);o.scale(s,s);o.translate(-x,-(y+120));
      o.shadowColor='rgba(0,0,0,.25)';o.shadowBlur=30;o.shadowOffsetY=10;o.fillStyle='#fff';rr(o,x,y,330,120,50);o.fill();o.shadowColor='transparent';
      for(let i=0;i<3;i++){o.fillStyle='#7b857f';o.globalAlpha=clamp(k*2)*(.35+.65*Math.max(0,Math.sin(t*7-i*.8)));o.beginPath();o.arc(x+105+i*60,y+60,16,0,7);o.fill();}
      o.restore();}
    if(t>=T7b)sideCards(o,t);
    if(t>=S.brand.start-.4){brandLock(o,t);}
    for(const [tx,key,a,b] of SUB){subtitle(o,tx,key,prog(t,a,.2),prog(t,b,.15));}
  }
  // fade from black at start
  if(t<.25){o.fillStyle=`rgba(0,0,0,${1-t/.25})`;o.fillRect(0,0,W,H);}
  return out.toDataURL('image/jpeg',.94);
}
window.renderAt=renderAt;
window.TOTAL=TL.total;
await document.fonts.load(font(40,800));await document.fonts.load(font(40,500));
window.READY=true;
